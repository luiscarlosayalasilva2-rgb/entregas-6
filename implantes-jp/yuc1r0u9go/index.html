<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ご購入ありがとうございます</title>
<style>
  :root{--bg:#FFFDF8;--ink:#1F2A44;--mut:#5B6275;--line:#E8E0CF;--acc:#B8452F;--ok:#2F8F6F;--chip:#FBE4D9}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:64px 20px;text-align:center}
  .badge{display:inline-block;font-size:13px;letter-spacing:.08em;background:var(--chip);color:var(--acc);padding:6px 14px;border-radius:99px;font-weight:700}
  h1{font-size:24px;line-height:1.45;margin:18px 0 12px;word-break:keep-all;overflow-wrap:anywhere}
  p{font-size:16px;line-height:1.8;color:var(--mut)}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 20px;margin-top:28px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:8px;animation:p 1.6s infinite}
  @keyframes p{50%{opacity:.3}}
  @media (prefers-reduced-motion: reduce){.dot{animation:none}}
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">ご購入が完了しました</span>
    <h1>インプラント・ビジュアルカード100 · 10ユニット・100枚の臨床カード＋特典「数値早見表」</h1>
    <p>ありがとうございます。ただいま教材の最終準備をしています。準備ができしだい、このページにすべてのファイルが追加されます。</p>
    <div class="card">
      <p><span class="dot"></span><strong style="color:#1F2A44">このリンクを保存してください</strong></p>
      <p>このページがあなたの専用アクセスです。数時間後にもう一度開くと、ご購入いただいた教材をダウンロードできます。</p>
    </div>
  </div>
</body>
</html>
